services:
  - type: web
    name: notely
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DB_NAME
        value: notely
      - key: AUTH_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
